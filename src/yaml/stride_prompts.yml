      Ensure the JSON response is correctly formatted and does not contain any additional text.
    
  assessment_template: |
    Conduct DREAD analysis for each identified threat. You MUST respond ONLY with a valid JSON object that follows this structure:
    {
      "Risk Assessment": [
      {
        "Threat Type": "Spoofing",
        "Scenario": "VDI Session Hijacking: A detailed attack scenario description",
        "Damage Potential": 8,
        "Reproducibility": 7,
        "Exploitability": 6,
        "Affected Users": 9,
        "Discoverability": 5
      },
      {
        "Threat Type": "Tampering".
        "Scenario": "VDI Configuration Tampering: Threat description",
        "Damage Potential": 7,
        "Reproducibility": 6,
        "Exploitability": 5,
        "Affected Users": 8,
        "Discoverability": 4
      },
      {
        "Threat Type": "Tampering",
        "Scenario": "VDI Configuration Tampering: Threat description",
        "Damage Potential": 7,
        "Reproducibility": 6,
        "Exploitability": 5,
        "Affected Users": 8,
        "Discoverability": 4
      },
      {
        "Threat Type": "Repudiation",
        "Scenario": "Insufficient Logging in VDI: Threat description",
        "Damage Potential": 6,
        "Reproducibility": 8,
        "Exploitability": 7,
        "Affected Users": 5,
        "Discoverability": 6
      },
      {
        "Threat Type": "Information Disclosure",
        "Scenario": "Sensitive Data Exposure in VDI: Threat description",
        "Damage Potential": 9,
        "Reproducibility": 5,
        "Exploitability": 6,
        "Affected Users": 7,
        "Discoverability": 8
      },
      {
        "Threat Type": "Denial of Service",
        "Scenario": "VDI Resource Exhaustion: Threat description",
        "Damage Potential": 8,
        "Reproducibility": 7,
        "Exploitability": 5,
        "Affected Users": 9,
        "Discoverability": 6
      },
      {
        "Threat Type": "Elevation of Privilege",
        "Scenario": "Privilege Escalation in VDI: Threat description",
        "Damage Potential": 10,
        "Reproducibility": 6,
        "Exploitability": 7,
        "Affected Users": 8,
        "Discoverability": 7
      }
    ]

      IMPORTANT: You MUST include multiple threats covering ALL six STRIDE categories in your assessment.

      For each threat:
      1. Damage Potential (1-10): How severe is the damage if the vulnerability is exploited?
      2. Reproducibility (1-10): How easy is it to reproduce the attack?
      3. Exploitability (1-10): How much effort and expertise is required to exploit the vulnerability?
      4. Affected Users (1-10): How many users would be impacted?
      5. Discoverability (1-10): How easy is it to discover the vulnerability?

      All scores must be integers between 1-10.

      IMPORTANT: For internet-facing systems, scores for Exploitability and Discoverability MUST be significantly higher (at least +2-3 points) than for non-internet-facing systems for the same type of threat.

      Compounding Risk Factors:
      - The combination of multiple risk factors MUST result in substantially higher scores than any single factor alone
      - Identify ALL relevant risk interactions specific to the system being assessed, not just the predefined combinations
      - Use your expertise to discover novel risk combinations based on system-specific attributes
      - Consider emergent risks that appear only when certain attributes combine in specific ways
      - Be particularly alert to attributes that might offset or amplify each other in context-specific ways
      - For systems with multiple high-risk attributes, scores should generally approach maximum values (8-10) for relevant categories

      Quality Control Guidelines:
      - Self-verify your assessment by checking for internal consistency across all DREAD ratings
      - Ensure score variations across threats reflect meaningful differences in risk levels
      - Validate that your assessment reflects the relative importance of different security properties (CIA) for this specific system
      - Verify that similar threats across different systems show appropriate score variations based on system attributes
      - Ensure your assessment includes threats specific to the system's technology stack, not just generic threats

      Score based on:
      - AWS/GCP/Azure security best practices relevant to the actual deployment environment
      - OWASP Top 10 2023 and API Security Top 10
      - NIST CSF guidelines and NIST 800-53 controls
      - System metadata attributes and their correlations
      - Combinatorial risk assessment (multiple attributes together create higher risk than the sum of individual risks)
      - Industry-specific threat intelligence and attack patterns
      - Threat actor capabilities and motivations relevant to the system
      - Historical vulnerability patterns for similar technologies
      - Emerging threats specific to the technologies in use

qa_stride:
  human_template: |
    You are a senior security QA expert responsible for validating STRIDE threat modeling results.

    FIRST: Carefully analyze the provided STRIDE output and verify that it meets all quality criteria.
    SECOND: Determine whether the output PASSES or FAILS quality validation.
    THIRD: If it fails, provide detailed, actionable feedback for improvement.

    The STRIDE output to analyze is:
    ```json
    {{stride_output}}
    ```

    Quality Criteria for STRIDE Analysis:
    1. Completeness: All STRIDE categories have 3-5 relevant threats
    2. Specificity: Threats are specific to the system's architecture, not generic
    3. Technical Accuracy: Descriptions reflect realistic attack vectors
    4. Business Relevance: Impact statements accurately reflect business consequences
    5. Actionable Mitigations: Security controls are specific and implementable
    6. Technology Alignment: Threats and mitigations match the system's technology stack
    7. Threat Diversity: Good mix of common and sophisticated attack vectors
    8. Contextual Awareness: Threats consider the specific system attributes (internet-facing, etc.)
    9. Real-world Viability: Attack scenarios represent actual attacker behaviors

    Return a response in this EXACT JSON format:
    ```json
    {
      "pass": true|false,
      "score": 1-10,
      "feedback": {
        "strengths": ["list of strengths"],
        "weaknesses": ["list of weaknesses"],
        "recommendations": ["specific suggestions for improvement"]
      },
      "category_scores": {
        "Spoofing": 1-10,
        "Tampering": 1-10,
        "Repudiation": 1-10,
        "Information Disclosure": 1-10,
        "Denial of Service": 1-10,
        "Elevation of Privilege": 1-10
      },
      "improvement_needed": "Detailed explanation of what needs to be fixed"
    }
    ```

    Scoring Guide:
    - 9-10: Excellent, industry-leading threat model
    - 7-8: Good, meets all requirements with minor improvements possible
    - 5-6: Acceptable but needs improvement in specific areas
    - 3-4: Poor, requires significant revisions
    - 1-2: Unacceptable, complete rework needed

    IMPORTANT: You MUST be rigorous. Do not pass substandard outputs. If you find ANY significant issues, mark it as failing and provide detailed feedback. The threshold for passing is a score of 7 or higher, and no individual category score below 6.

    Return ONLY a valid JSON object with your assessment - no other text.

qa_dread:
  human_template: |
    You are a senior security risk assessment expert responsible for validating DREAD scoring results.

    FIRST: Carefully analyze the provided DREAD assessment and verify that it meets all quality criteria.
    SECOND: Determine whether the assessment PASSES or FAILS quality validation.
    THIRD: If it fails, provide detailed, actionable feedback for improvement.

    The DREAD assessment to analyze is:
    ```json
    {{dread_output}}
    ```

    Quality Criteria for DREAD Assessment:
    1. Scoring Consistency: Similar threats have similar scores across different systems
    2. Attribute Sensitivity: Scores reflect the system's attributes (internet-facing, confidentiality, etc.)
    3. Risk Differentiation: Clear distinction between high, medium, and low risks
    4. Correlation Recognition: Multiple risk factors result in appropriately elevated scores
    5. Category Consistency: Threats in the same category have reasonable score variations
    6. Technical Accuracy: Scores reflect technical reality of exploitation difficulty
    7. Business Impact Alignment: Damage potential and affected users scores reflect business context
    8. Pattern Recognition: Similar threats have similar relative scores across categories
    9. Contextual Scoring: Environment factors (internet-facing, etc.) properly considered

    Return a response in this EXACT JSON format:
    ```json
    {
        "pass": true|false,
        "score": 1-10,
        "feedback": {
            "strengths": ["list of strengths"],
            "weaknesses": ["list of weaknesses"],
            "recommendations": ["specific suggestions for improvement"]
        },
        "category_scores": {
            "Damage Potential": 1-10,
            "Reproducibility": 1-10,
            "Exploitability": 1-10,
            "Affected Users": 1-10,
            "Discoverability": 1-10
        },
        "improvement_needed": "Detailed explanation of what needs to be fixed"
    }
    ```

    Scoring Guide:
    - 9-10: Excellent, precise risk assessment with perfect correlation to system attributes
    - 7-8: Good, scores properly reflect system risks with minor inconsistencies
    - 5-6: Acceptable but has noticeable scoring inconsistencies
    - 3-4: Poor, scores do not properly reflect system attributes
    - 1-2: Unacceptable, completely inaccurate scoring

    IMPORTANT VALIDATION CHECKS:
    - For internet-facing systems, Exploitability and Discoverability scores MUST be at least 2-3 points higher than equivalent non-internet facing systems
    - High confidentiality systems MUST have higher Damage Potential scores
    - Systems with multiple high-risk attributes MUST have elevated scores across multiple DREAD categories
    - Validate that combinations of attributes (like Internet-facing + High Confidentiality) result in significantly higher scores

    The threshold for passing is a score of 7 or higher, and no individual category score below 6.

qa_final:
  human_template: |
    You are a final quality assurance expert for threat models. Your task is to review and make final improvements to a combined STRIDE and DREAD assessment.

    The complete threat model to review is:
    ```json
    {{threat_model}}
    ```

    Your task is to make final quality improvements directly to the model without requiring a feedback loop:

    1. Ensure all STRIDE threats have appropriate, realistic descriptions and mitigations
    2. Verify DREAD scores reflect the system's attributes (especially internet-facing status)
    3. Check for consistency between STRIDE threats and their corresponding DREAD assessments
    4. Ensure high-risk combinations of attributes result in appropriately elevated scores
    5. Make any necessary adjustments to improve overall quality

    Return the COMPLETE improved threat model with your changes directly applied. Make only quality-enhancing changes without altering the overall structure.

    Return a valid JSON object with the EXACT same structure as the input, but with your quality improvements applied.