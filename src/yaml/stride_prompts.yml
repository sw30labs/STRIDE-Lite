dread:
  format_template: |
    As an expert security risk analyst, provide a comprehensive, contextually-aware risk assessment in JSON format with a "Risk Assessment" array. Your assessment must be tailored to the specific system, its industry context, and its unique attributes. Each threat assessment MUST include:

    {
    "Risk Assessment": [
      {
        "Threat Type": "Category (e.g., Spoofing)",
        "Scenario": "Specific threat name",
        "Damage Potential": "Score 1-10",
        "Reproducibility": "Score 1-10",
        "Exploitability": "Score 1-10",
        "Affected Users": "Score 1-10",
        "Discoverability": "Score 1-10"
      }
    ]
    }

    Scoring Guidelines:
      1. Damage Potential (1-10):
      - Low (1-3): Limited impact, easily recoverable
      - Medium (4-6): Significant impact, recoverable with effort
      - High (7-10): Critical impact, potential business damage
      - IMPORTANT: Higher confidentiality levels should result in higher damage potential scores

    2. Reproducibility (1-10):
      - Low (1-3): Complex setup, specific conditions needed
      - Medium (4-6): Reproducible with some effort
      - High (7-10): Consistently reproducible
      - IMPORTANT: Internet-facing systems should generally have higher reproducibility scores for external attack vectors

    3. Exploitability (1-10):
            - Low (1-3): Advanced skills required, not externally accessible
            - Medium (4-6): Some technical knowledge needed, limited external exposure
            - High (7-10): Basic skills sufficient, especially for internet-facing systems
            - IMPORTANT: Internet-facing systems MUST receive +2-3 points to exploitability scores compared to equivalent internal-only systems

    4. Affected Users (1-10):
      - Low (1-3): Individual users
      - Medium (4-6): Specific user groups
      - High (7-10): All system users
      - IMPORTANT: Higher availability requirements (Level 1 is highest) should result in higher affected users scores

    5. Discoverability (1-10):
      - Low (1-3): Not visible externally, internal systems only
      - Medium (4-6): Requires some investigation, limited external visibility
      - High (7-10): Obvious or publicly known, especially for internet-facing systems
      - IMPORTANT: Internet-facing systems MUST receive +2-3 points to discoverability scores for threat vectors accessible from the internet

      Return ONLY a valid JSON object with your assessment.

      System Metadata Considerations:

      When assigning DREAD scores, you MUST significantly consider the following system metadata:

      1. "Internet facing" status:
        - true / yes:
          * MUST increase Exploitability scores by at least 2-3 points
          * MUST increase Discoverability scores by at least 2-3 points
          * Consider higher Reproducibility for external attack vectors

      2. Confidentiality level:
        - Higher confidentiality (Level 1 is highest) should result in higher Damage Potential scores
        - Consider regulatory implications (GDPR, HIPAA, PCI-DSS, etc.) based on data classifications

      3. Availability:
        - Higher availability (Level 1 is highest) should result in higher Affected Users scores
        - Consider business continuity impact in the context of the system's function

      4. Industry Context:
        - Financial services systems require heightened sensitivity to integrity threats
        - Healthcare systems demand special consideration for confidentiality and availability
        - Critical infrastructure requires emphasis on availability and operational resilience

      5. Attribute Correlations - You MUST account for compounding effects when multiple risk factors are present:
          - EXAMPLES of high-risk combinations (not exhaustive):
            * Internet-facing + High Confidentiality: These systems should receive the HIGHEST exploitability AND damage potential scores
            * Internet-facing + Availability Level 1: Score these systems with MAXIMUM affected users AND reproducibility scores
            * High Confidentiality + customer data: These combinations should result in

