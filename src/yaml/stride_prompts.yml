stride:
  human_template: |
    You are a senior cybersecurity expert performing STRIDE analysis for enterprise systems. Your expertise includes OWASP Top 10, MITRE ATT&CK, cloud security patterns, and industry-specific threat models. Return ONLY a valid JSON object with this EXACT structure:

    {
        "Spoofing": [
            {
                "threat_name": "VDI Session Hijacking",
                "description": "Attacker intercepts and takes over a user's VDI session",
                "impact": "Unauthorized access to sensitive data and operations",
                "mitigation": "Implement session encryption, multi-factor authentication, and session monitoring"
            },
            {
                "threat_name": "User Credential Spoofing",
                "description": "Attacker uses stolen credentials to impersonate legitimate users",
                "impact": "Unauthorized access to sensitive data and operations",
                "mitigation": "Implement strong password policies, multi-factor authentication, and credential monitoring"
            },
            {
                "threat_name": "Network Traffic Interception",
                "description": "Attacker intercepts network traffic to capture sensitive information",
                "impact": "Data interception and potential data breach",
                "mitigation": "Use end-to-end encryption and secure network protocols"
            }
        ],
        "Tampering": [
            {
                "threat_name": "VDI Configuration Tampering",
                "description": "Attacker modifies VDI configurations to weaken security",
                "impact": "Security control bypass and system compromise",
                "mitigation": "Use configuration management and integrity monitoring"
            },
            {
                "threat_name": "Virtual Disk Manipulation",
                "description": "Attacker modifies virtual disk contents to inject malicious data",
                "impact": "Data corruption and unauthorized operations",
                "mitigation": "Implement access controls and integrity checks"
            },
            {
                "threat_name": "Network Packet Tampering",
                "description": "Attacker modifies network packets to inject malicious data",
                "impact": "Data corruption and unauthorized operations",
                "mitigation": "Use secure network protocols and packet integrity checks"
            },
            {
                "threat_name": "Outdated Software Exploitation",
                "description": "Attacker exploits vulnerabilities in outdated software published in the VDI environment",
                "impact": "Data breach and regulatory violations",
                "mitigation": "Use encryption and access controls for virtual disks"
            },
            {
                "threat_name": "Network Traffic Exposure in VDI Environment",
                "description": "Sensitive data exposed through unencrypted network traffic",
                "impact": "Data interception and potential data breach",
                "mitigation": "Use end-to-end encryption and secure network protocols"
            }
          ],
          "Denial of Service": [
            {
                "threat_name": "VDI Resource Exhaustion",
                "description": "Attacker consumes VDI resources to disrupt service",
                "impact": "Service unavailability and degraded performance",
                "mitigation": "Implement resource quotas and monitoring"
            },
            {
                "threat_name": "Network Flooding Targeting VDI Infrastructure",
                "description": "Attacker floods network to disrupt VDI services",
                "impact": "Service unavailability and degraded performance",
                "mitigation": "Implement network traffic monitoring and rate limiting"
            },
            {
                "threat_name": "Virtual Machine Resource Depletion",
                "description": "Attacker consumes virtual machine resources to disrupt service",
                "impact": "Service unavailability and degraded performance",
                "mitigation": "Implement resource quotas and monitoring"
            }
          ],
          "Elevation of Privilege": [
            {
                "threat_name": "Privilege Escalation within Virtual Machines",
                "description": "Attacker gains higher privileges within virtual machines",
                "impact": "Unauthorized access to privileged functions",
                "mitigation": "Implement proper RBAC and permission boundaries"
            },
            {
                "threat_name": "User Role Abuse in VDI Environment",
                "description": "Attacker exploits RBAC flaws to gain higher privileges",
                "impact": "Unauthorized access to privileged functions",
                "mitigation": "Implement proper RBAC and permission boundaries"
            },
            {
                "threat_name": "Virtual Machine Escape Attacks",
                "description": "Attacker escapes from virtual machine to host environment",
                "impact": "Complete system compromise",
                "mitigation": "Use virtualization security best practices and monitoring"
            }
          ]
          }

          REQUIREMENTS:
          1. Follow this EXACT format for each threat
          2. Include EXACTLY 3-5 threats per category, prioritizing the most relevant threats for the specific system
          3. Use these EXACT category names
          4. Return ONLY valid JSON - no other text
          5. Ensure threats are specific to the system's technology stack, architecture, and business function
          6. Include a mix of common and sophisticated threat vectors

          IMPORTANT QUALITY CONSIDERATIONS:
          - Adapt threat descriptions to the specific system attributes (architecture, data sensitivity, user base)
          - Consider the system's technology stack when identifying threats (e.g., containerization, serverless, microservices)
          - Ensure threat mitigations are specific, actionable, and appropriate for the technology
          - Verify that impact statements reflect the actual business impact based on the system's function
          - Balance between common threats and more sophisticated attack vectors relevant to the system

          Example threats by category to consider (adapt these to the specific system):

          1. Spoofing:
            - VDI session hijacking
            - User credential spoofing
            - Network traffic interception
            - Virtual machine impersonation

          2. Tampering:
            - VDI configuration tampering
            - Virtual disk manipulation
            - Network packet tampering
            - Application tampering within VDI

          3. Repudiation:
            - VDI session repudiation
            - User action denial within VDI
            - Log file manipulation in VDI environment
            - Activity masking within virtual sessions

          4. Information Disclosure:
            - Sensitive data exposure in VDI sessions
            - Virtual disk data leakage
            - Network traffic exposure in VDI environment

          5. Denial of Service:
            - VDI resource exhaustion
            - Network flooding targeting VDI infrastructure
            - Virtual machine resource depletion
            - Service disruption in VDI environment

          6. Elevation of Privilege:
            - Privilege escalation within virtual machines
            - User role abuse in VDI environment
            - Virtual machine escape attacks
            - Service account compromise within VDI

          IMPORTANT:
          - Every category MUST have 3-5 threats
          - Each threat MUST include name, description, impact, and mitigation
          - Focus on security concerns specific to the system's architecture (cloud-native, on-prem, hybrid)
          - Provide specific, actionable mitigations that align with industry best practices
          - Ensure threats reflect actual attacker behaviors and viable attack paths
          - Consider both external threats and insider risks based on the system's context
          - Self-verify your analysis for consistency, relevance, and completeness before returning

          Return ONLY a complete JSON object with ALL categories populated.

