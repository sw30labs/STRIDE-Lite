  content: |
    # Sample Cyber Threat Intelligence Feed

    Fictional quarterly notes for format guidance only.

    ## Executive Summary
    Phishing and public-facing application exploits remain the most common
    initial-access paths against demo financial-sector peers.

    ## Top themes
    1. Credential phishing against webmail.
    2. Exploitation of unpatched edge appliances.
    3. Ransomware affiliates buying initial access.

    ## Sources
