          E- Kill chain Description: A very detailed kill chain (descriptive) based on the data available. This narrative should describe the step-by-step progression of the attack, incorporating the CVE vulnerabilities, CTI insights, STRIDE threats, and suspected failed controls. Include one section per stage, and add a
          kill chain summary.
